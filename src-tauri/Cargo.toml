[package]
name = "wisplingua"
version = "1.0.1"
description = "Tray-resident LLM translator with hotkey-driven popup"
authors = ["isham"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wisplingua_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
eventsource-stream = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"
dirs = "5"
url = "2"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }

arboard = "3"
enigo = { version = "0.3", default-features = false, features = ["wayland", "xdo"] }
rdev = { version = "0.5", features = ["serialize"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
whatlang = "0.16"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
